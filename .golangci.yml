version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - noctx
    - perfsprint
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
  settings:
    errcheck:
      # Never-failing in-memory writers (also in errcheck defaults; keep explicit).
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).Write
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - (*strings.Builder).WriteString
        - fmt.Fprint(*bytes.Buffer)
        - fmt.Fprintf(*bytes.Buffer)
        - fmt.Fprintln(*bytes.Buffer)
        - fmt.Fprint(*strings.Builder)
        - fmt.Fprintf(*strings.Builder)
        - fmt.Fprintln(*strings.Builder)
    depguard:
      rules:
        non-tests:
          files:
            - '!$test'
          deny:
            - pkg: testing
              desc: Use testing only in test files.
            - pkg: github.com/stretchr/testify
              desc: Use testify only in test files.
            - pkg: crypto/md5
            - pkg: crypto/sha1
            - pkg: crypto/**/pkix
    gocritic:
      disabled-checks:
        - appendAssign
        # max/min as param names are idiomatic; renaming to maxInt is worse.
        - builtinShadow
        - commentedOutCode
        - dupArg
        # Test path literals like "/tmp/..." are clearer than filepath.Join theater.
        - filepathJoin
        - hugeParam
        # Prefer readable if/else for short mutually-exclusive chains.
        - ifElseChain
        - importShadow
        - preferDecodeRune
        - rangeValCopy
        # Multi-return helpers are fine; don't invent result structs for lint.
        - tooManyResultsChecker
        # Type-before-methods is preference, not correctness.
        - typeDefFirst
        - unnamedResult
        - whyNoLint
      enable-all: true
    godot:
      exclude:
        # Exclude links.
        - '^ *\[[^]]+\]:'
        # Exclude sentence fragments for lists.
        - ^[ ]*[-•]
        # Exclude sentences prefixing a list.
        - :$
    misspell:
      locale: US
      ignore-rules:
        - cancelled
        # JetBrains theme name; not a misspelling of "Dracula".
        - darcula
        # chroma lexer API spelling.
        - analyse
    modernize:
      disable:
        - omitzero
    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true
    revive:
      confidence: 0.01
      enable-all-rules: false
      enable-default-rules: true
      max-open-files: 2048
      rules:
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: context-as-argument
          arguments:
            - allow-types-before: '*testing.T'
          disabled: true
        - name: context-keys-type
        - name: deep-exit
        - name: defer
          arguments:
            - - call-chain
              - loop
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
          arguments:
            - preserve-scope
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        # Exported docs matter for public APIs; internal packages should not be
        # forced into comment spam. Prefer clarity over mechanical coverage.
        - name: exported
          disabled: true
        # A single bool is often clearer than twin functions / option enums.
        # Prefer options structs only when there are many knobs.
        - name: flag-parameter
          disabled: true
        - name: identical-branches
        - name: if-return
        # Shadowing an import with a param of that package's type (e.g. llm llm.Client)
        # is common and readable; ban creates worse names like "compactor".
        - name: import-shadowing
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
          arguments:
            - preserve-scope
        # Package comments are welcome when they add signal; not required noise.
        - name: package-comments
          disabled: true
        - name: range
        - name: range-val-in-closure
        - name: range-val-address
        - name: receiver-naming
        # Idiomatic Go freely uses names like max, min, len as locals/params.
        - name: redefines-builtin-id
          disabled: true
        - name: string-format
          arguments:
            - - panic
              - /^[^\n]*$/
              - must not contain line breaks
        - name: struct-tag
        - name: superfluous-else
          arguments:
            - preserve-scope
        - name: time-equal
        - name: unconditional-recursion
        # Returning an unexported request type from an internal helper is fine.
        - name: unexported-return
          disabled: true
        - name: unhandled-error
          arguments:
            - fmt.Fprint
            - fmt.Fprintf
            - fmt.Fprintln
            - fmt.Print
            - fmt.Printf
            - fmt.Println
            # In-memory writers never return a non-nil error (same as errcheck defaults).
            - strings.Builder.Write
            - strings.Builder.WriteByte
            - strings.Builder.WriteRune
            - strings.Builder.WriteString
            - bytes.Buffer.Write
            - bytes.Buffer.WriteByte
            - bytes.Buffer.WriteRune
            - bytes.Buffer.WriteString
        - name: unused-parameter
        - name: unused-receiver
        - name: unnecessary-stmt
        - name: use-any
        - name: useless-break
        - name: var-declaration
        - name: var-naming
          arguments:
            - ["ID"] # AllowList
            - ["Otel", "Aws", "Gcp"] # DenyList
            - - skip-package-name-collision-with-go-std: true
        - name: waitgroup-by-value
    testifylint:
      enable-all: true
      disable:
        - float-compare
        - go-require
        - require-error
    usetesting:
      context-background: true
      context-todo: true
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # It's okay to not run gosec and perfsprint in a test.
      - linters:
          - gosec
          - perfsprint
        path: _test\.go
      # Ignoring gosec G404: Use of weak random number generator (math/rand instead of crypto/rand)
      # as we commonly use it in tests and examples.
      - linters:
          - gosec
        text: 'G404:'
      # Ignoring gosec G402: TLS MinVersion too low
      # as the https://pkg.go.dev/crypto/tls#Config handles MinVersion default well.
      - linters:
          - gosec
        text: 'G402: TLS MinVersion too low.'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/pulseaiclub/phi
    golines:
      max-len: 120
  exclusions:
    generated: lax
