# GoReleaser configuration
# Docs: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cozyphi
    main: ./cmd
    binary: cozyphi
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/alvnukov/cozyphi/internal/version.Version=v{{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums_{{ .Version }}.txt"

# Keyless cosign signing (installed in release.yml): .sig + .pem land in the
# release assets and verify against the release workflow's OIDC identity.
signs:
  - cmd: cosign
    artifacts: all
    output: true
    certificate: '${artifact}.pem'
    signature: '${artifact}.sig'
    args:
      - sign-blob
      - --yes
      - --output-signature
      - '${signature}'
      - --output-certificate
      - '${certificate}'
      - '${artifact}'

# Release notes come from CHANGELOG.md via --release-notes (see release.yml).
changelog:
  disable: true

release:
  draft: false
  prerelease: auto
  # Always apply --release-notes from release.yml (replace existing body on re-runs).
  mode: replace

