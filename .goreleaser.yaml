# GoReleaser configuration
# Docs: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: phi
    main: ./cmd
    binary: phi
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/pulseaiclub/phi/internal/version.Version=v{{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums_{{ .Version }}.txt"

# Release notes come from CHANGELOG.md via --release-notes (see release.yml).
changelog:
  disable: true

release:
  draft: false
  prerelease: auto

