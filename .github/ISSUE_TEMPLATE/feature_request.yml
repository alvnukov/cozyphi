name: Feature request
description: Suggest an improvement or new capability for cozyphi
title: "[feat]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please keep cozyphi small and focused — say what problem you're solving, and the template will help us understand the trade-offs.
        - Search [existing issues](https://github.com/alvnukov/cozyphi/issues) for a duplicate or related discussion first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The pain point or missing capability you ran into, with a concrete scenario if possible.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine it working — behavior, commands, config, or UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you thought about, and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, sketches, related projects, or anything else that helps.
