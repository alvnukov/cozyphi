# SAST: CodeQL over the Go codebase — Scorecard's SAST check looks for this.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 5 * * 1' # weekly, off-peak minute

permissions:
  contents: read

# A newer push cancels the superseded run - except on main, where every
# change deserves its own complete, reportable run.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload of SARIF results needs write on security-events.
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Default build mode (autobuild): pure-Go module, `go build ./...` —
      # Go supports no other no-build extraction.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
