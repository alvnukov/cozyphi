# SAST: CodeQL over the Go codebase — Scorecard's SAST check looks for this.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 5 * * 1' # weekly, off-peak minute

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload of SARIF results needs write on security-events.
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # build-mode: none — CodeQL extracts Go without a build step, so the
      # analysis cannot break on build flags or cgo environments.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
