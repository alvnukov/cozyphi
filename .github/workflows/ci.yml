name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the superseded run — except on main, where every
# change deserves its own complete, reportable run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pin to go.mod — `stable` can jump ahead of golangci-lint's build Go.
          go-version-file: go.mod

      - name: Resolve golangci-lint version
        run: echo "GOLANGCI_LINT_VERSION=$(cat .golangci-lint-version)" >> "$GITHUB_ENV"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Lint
        run: make lint

  fmt-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve golangci-lint version
        run: echo "GOLANGCI_LINT_VERSION=$(cat .golangci-lint-version)" >> "$GITHUB_ENV"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Check formatting
        run: make fmt-check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One red OS must not silence the others; failures are evidence.
      fail-fast: false
      # No Windows leg: OS-specific test semantics (POSIX perms, JSON path
      # escaping, time formatting) kept the leg red at real cycle cost.
      # The suite stays portable — the guards stay in the fixtures.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test-race

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the badge-publish step below writes — it force-pushes the data-only
    # `badges` branch, so it needs contents:write. Everything else stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: make cover

      - name: Summarize coverage
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

      # README badges render these files through shields.io/endpoint:
      # https://raw.githubusercontent.com/alvnukov/cozyphi/badges/coverage.json
      # https://raw.githubusercontent.com/alvnukov/cozyphi/badges/go.json
      # PR runs compute the coverage number too; only main pushes publish.
      - name: Publish badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          scripts/coverage-badge.sh coverage.out > /tmp/coverage.json
          printf '{"schemaVersion":1,"label":"go","message":"%s","color":"00ADD8"}\n' \
            "$(sed -n 's/^go //p' go.mod | head -n 1)" > /tmp/go.json
          cat /tmp/coverage.json /tmp/go.json
          dir="$(mktemp -d)"
          git worktree add --detach "$dir"
          (
            cd "$dir"
            git checkout --orphan badges
            git rm -rqf .
            git config user.name "cozyphi-ci"
            git config user.email "cozyphi-ci@users.noreply.github.com"
            cp /tmp/coverage.json /tmp/go.json .
            git add coverage.json go.json
            git commit -m "chore: refresh badges"
            # Data-only branch: one fresh orphan commit per run, no history growth.
            git push --force origin HEAD:refs/heads/badges
          )
