name: Release

on:
  push:
    tags:
      - 'v*'          # matches v1.0.0, v0.2.3, etc.
      - 'v*-*'        # matches v1.0.0-alpha, v2.0.0-rc1, etc.

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release
      id-token: write   # cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history needed for GoReleaser
          # The job holds contents: write and id-token: write, and the build
          # below runs third-party module code. GoReleaser talks to the API
          # through GITHUB_TOKEN, so it needs no git credentials on disk.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      # Notes must live outside the workspace: GoReleaser aborts on a dirty git tree,
      # and writing release-notes.md in the repo root would leave an untracked file.
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          scripts/changelog-extract.sh "${{ github.ref_name }}" > "$NOTES"
          echo "---- release notes ----"
          cat "$NOTES"
          if [[ ! -s "$NOTES" ]]; then
            echo "error: release notes empty (no CHANGELOG section for ${{ github.ref_name }}?)" >&2
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      # Keyless cosign: signs every artifact (see `signs:` in .goreleaser.yaml);
      # .sig + .pem are uploaded with the release and verify against this
      # workflow's OIDC identity.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Run GoReleaser
        run: goreleaser release --clean --release-notes="${{ steps.changelog.outputs.path }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
