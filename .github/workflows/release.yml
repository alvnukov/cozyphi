name: Release

on:
  push:
    tags:
      - 'v*'          # matches v1.0.0, v0.2.3, etc.
      - 'v*-*'        # matches v1.0.0-alpha, v2.0.0-rc1, etc.

permissions:
  contents: write      # allow creating a Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run tests
        run: make test

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
