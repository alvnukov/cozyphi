name: Release

on:
  push:
    tags:
      - 'v*'          # matches v1.0.0, v0.2.3, etc.
      - 'v*-*'        # matches v1.0.0-alpha, v2.0.0-rc1, etc.

permissions:
  contents: write      # allow creating a Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed for GoReleaser

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Extract release notes from CHANGELOG.md
        run: |
          scripts/changelog-extract.sh "${{ github.ref_name }}" > "$RUNNER_TEMP/release-notes.md"
          echo "---- release notes ----"
          cat "$RUNNER_TEMP/release-notes.md"
          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "error: release-notes.md is empty (no CHANGELOG section for ${{ github.ref_name }}?)" >&2
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes="$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
