name: Release

on:
  push:
    tags:
      - 'v*'          # matches v1.0.0, v0.2.3, etc.
      - 'v*-*'        # matches v1.0.0-alpha, v2.0.0-rc1, etc.

permissions:
  contents: write      # allow creating a Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed for GoReleaser

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Extract release notes from CHANGELOG.md
        run: |
          scripts/changelog-extract.sh "${{ github.ref_name }}" > /tmp/release-notes.md
          echo "---- release notes ----"
          cat /tmp/release-notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
