# OpenSSF Scorecard: publishes results to the public dataset
# (api.securityscorecards.dev) on every push to main.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 1' # keep the dataset fresh even without pushes

# No default grants; the job below escalates only what it needs.
permissions: {}

jobs:
  analysis:
    name: scorecard-analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload results to code scanning (Security tab).
      security-events: write
      # Publish results to the dataset (publish_results: true).
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Branch-Protection check only sees main when it is protected by a
      # Repository Ruleset: the default GITHUB_TOKEN can read rulesets, but not
      # classic branch protection. Switching to classic protection means adding
      # a fine-grained PAT (Administration: read) here as repo_token.
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
