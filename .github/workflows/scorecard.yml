# OpenSSF Scorecard: publishes results to the public dataset
# (api.securityscorecards.dev) on every push to main.
name: scorecard

on:
  push:
    branches: [main]
  # Scorecard accepts the default branch only, so this reruns the analysis on
  # main on demand: after a token rotation, without waiting out the cron.
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1' # keep the dataset fresh even without pushes

# No default grants; the job below escalates only what it needs.
permissions: {}

jobs:
  analysis:
    name: scorecard-analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload results to code scanning (Security tab).
      security-events: write
      # Publish results to the dataset (publish_results: true).
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The default GITHUB_TOKEN reads rulesets but not classic branch
      # protection, so Branch-Protection needs a fine-grained PAT
      # (Administration: read-only) scoped to this repository. Fine-grained PATs
      # expire after at most one year; on expiry, re-create the PAT and update
      # the SCORECARD_TOKEN secret.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
